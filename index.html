<!DOCTYPE html>

    <title>Batman | O Cavaleiro das Trevas</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte moderna e robusta para o herói -->

</head>
<body>

    <main class="bat-card">

            <!-- Um símbolo estilizado apenas com CSS (um círculo preto minimalista) -->

            <h1>BATMAN</h1>
            <p class="tagline">O Cavaleiro das Trevas</p>

        <section class="bat-info">
            <p><strong>Identidade Secreta:</strong> Bruce Wayne</p>
            <p><strong>Cidade:</strong> Gotham City</p>
            <p><strong>Habilidades:</strong> Intelecto nível genial, mestre em artes marciais, exímio detetive e tecnologia de ponta.</p>
        </section>

        <footer class="bat-footer">
            <a href="#" class="bat-btn">Ativar Bat-Sinal</a>
        </footer>
